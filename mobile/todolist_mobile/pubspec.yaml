name: todolist_mobile
description: ToDoList移动端应用 - Flutter版本
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI组件
  cupertino_icons: ^1.0.2
  
  # 网络请求
  http: ^1.1.0
  dio: ^5.3.2
  
  # 本地存储
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  
  # 状态管理
  provider: ^6.1.1
  
  # JSON序列化
  json_annotation: ^4.8.1
  
  # 路由导航
  go_router: ^12.1.1
  
  # 设备信息
  device_info_plus: ^9.1.0
  
  # 生物认证
  local_auth: ^2.1.6
  
  # 文件操作
  path_provider: ^2.1.1
  
  # 日期时间
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFProDisplay-Regular.ttf
        - asset: assets/fonts/SFProDisplay-Bold.ttf
          weight: 700